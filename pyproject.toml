[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hp2sph"
version = "0.1.0"
description = "Fast HEALPix map <-> spherical-harmonic (alm) transforms (HP2SPH; Drake & Wright, arXiv:1904.10514)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Artem Basyrov" }]
keywords = ["healpix", "spherical-harmonics", "cmb", "astrophysics", "fft"]

# Pure-Python dependencies (installable from PyPI). The FSHT stage additionally
# needs the native libfasttransforms C library, which is NOT on PyPI -- see
# README.md for how to build/install it. It is discovered automatically at
# runtime, so no environment variable is required.
dependencies = [
    "numpy",
    "scipy",
    "healpy",
    "finufft",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["hp2sph"]

[tool.ruff.lint]
# `l` is the multipole index throughout, and matches the notation of the paper and
# of healpy. Renaming it to satisfy the ambiguous-name rule would make the code
# harder to read against the reference, not easier.
ignore = ["E741"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# The OpenMP guards must be set before any library that links libomp is imported,
# so these modules deliberately place imports after executable statements.
"tests/conftest.py" = ["E402"]
"tests/test_paper_accuracy.py" = ["E402"]
# Imported to assert the module's public surface exists, not to be called.
"tests/test_spin_FSHT.py" = ["F401"]
